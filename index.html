<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tagz">
<meta name="theme-color" content="#0e1113">
<link rel="manifest" href="manifest.json?v=20260718-3">
<link rel="apple-touch-icon" href="icon-180.png?v=20260718-3">
<title>Tagz</title>
<style>
:root{
  --bg:#0e1113; --card:#161b1e; --line:#242c31; --txt:#e8edef; --sub:#8b979d;
  --amber:#ffb340; --amber2:#f5a623; --cyan:#3fd4e6; --green:#38d283; --red:#ff6b6b;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;padding:16px 14px 220px;max-width:560px;margin:0 auto}
header{display:flex;align-items:baseline;gap:10px;margin:6px 2px 16px}
header h1{font-size:30px;font-weight:900;letter-spacing:.5px}
header h1 span{color:var(--amber)}
header .by{font-size:12px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:12px;color:var(--sub);letter-spacing:1.5px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.card h2 .hint{font-weight:400;letter-spacing:0;font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#0f1417;color:var(--txt);border-radius:999px;padding:9px 13px;font-size:14px;min-height:38px}
.chip.on{background:var(--amber);border-color:var(--amber);color:#141414;font-weight:700}
.chip.key.on{background:var(--cyan);border-color:var(--cyan)}
.chip.feature.on{background:var(--green);border-color:var(--green)}
.bpmrow{display:flex;align-items:center;gap:10px;margin-top:9px}
.bpmrow button{width:46px;height:42px;border-radius:11px;border:1px solid var(--line);background:#0f1417;color:var(--amber);font-size:20px;font-weight:700}
.bpmrow .v{font-size:26px;font-weight:800;min-width:64px;text-align:center;color:var(--amber)}
.spin{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,var(--amber),var(--amber2));color:#141414;font-size:17px;font-weight:900;letter-spacing:1px;margin:2px 0 12px}
.spin:active{transform:scale(.98)}
.out{position:fixed;left:0;right:0;bottom:0;background:#12171a;border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:8px 0;text-align:center;border-radius:9px;border:1px solid var(--line);background:#0f1417;color:var(--sub);font-size:13px;font-weight:700}
.tab.on{background:#1c2429;color:var(--cyan);border-color:var(--cyan)}
.otext{background:#0b0f11;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;min-height:44px;color:var(--txt)}
.obtns{display:flex;gap:8px;margin-top:8px}
.obtns button{flex:1;padding:12px;border:none;border-radius:11px;font-size:15px;font-weight:800}
#copyBtn{background:var(--cyan);color:#0b2226}
#saveBtn{background:var(--green);color:#0b2415}
.loghead{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px}
.loghead h2{font-size:13px;color:var(--sub);letter-spacing:1.5px}
.loghead .cnt{font-size:12px;color:var(--green);font-weight:700}
.logitem{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.logitem .li-main{flex:1;min-width:0}
.logitem .li-name{font-size:14.5px;font-weight:700;word-break:break-all}
.logitem .li-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.logitem button{border:1px solid var(--line);background:#0f1417;border-radius:9px;padding:8px 10px;font-size:13px;color:var(--cyan)}
.logitem button.del{color:var(--red)}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:190px;background:var(--green);color:#0b2415;font-weight:800;font-size:14px;padding:9px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
footer{color:#5a666c;font-size:11px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<header><h1>Tag<span>z</span></h1><div class="by">beat file naming · kedy</div></header>

<button class="spin" id="spinBtn">🎰 SPIN（STYLE・FEATURE・KEY）</button>

<div class="card">
  <h2>🎛 STYLE <span class="hint">ビートの系統</span></h2>
  <div class="chips" id="styleChips"></div>
</div>

<div class="card">
  <h2>✨ FEATURE <span class="hint">音色・質感・雰囲気</span></h2>
  <div class="chips" id="featureChips"></div>
</div>

<div class="card">
  <h2>🎚 BPM <span class="hint">±1で微調整</span></h2>
  <div class="chips" id="bpmChips"></div>
  <div class="bpmrow"><button id="bpmDown">−</button><div class="v" id="bpmVal">165</div><button id="bpmUp">＋</button></div>
</div>

<div class="card">
  <h2>🎹 KEY <span class="hint">FILEは Am / C 形式</span></h2>
  <div class="chips" id="keyChips"></div>
</div>

<div class="card">
  <h2>👤 TYPE <span class="hint">YouTubeタイトル用</span></h2>
  <div class="chips" id="typeChips"></div>
</div>

<div class="loghead"><h2>📓 制作ログ</h2><div class="cnt" id="logCnt"></div></div>
<div id="logList"></div>

<footer>Tagz v2.1 · 2026.08.20</footer>

<div class="out">
  <div class="tabs">
    <div class="tab on" data-f="file">FILE</div>
    <div class="tab" data-f="listing">出品</div>
    <div class="tab" data-f="yt">YT</div>
  </div>
  <div class="otext" id="oText"></div>
  <div class="obtns"><button id="copyBtn">📋 コピー</button><button id="saveBtn">💾 ログに保存</button></div>
</div>
<div class="toast" id="toast">Copied</div>

<script>
const STYLES=["trap","plug","rage","jerk","drill","cloud","pop","afro","digicore"];
const FEATURES=["piano","bell","guitar","synth","strings","dark","chill","airy","hard","sad"];
const KEYS=[
  {label:"Cmaj",file:"C"},{label:"C#maj",file:"C#"},{label:"Dmaj",file:"D"},{label:"D#maj",file:"D#"},
  {label:"Emaj",file:"E"},{label:"Fmaj",file:"F"},{label:"F#maj",file:"F#"},{label:"Gmaj",file:"G"},
  {label:"G#maj",file:"G#"},{label:"Amaj",file:"A"},{label:"A#maj",file:"A#"},{label:"Bmaj",file:"B"},
  {label:"Cmin",file:"Cm"},{label:"C#min",file:"C#m"},{label:"Dmin",file:"Dm"},{label:"D#min",file:"D#m"},
  {label:"Emin",file:"Em"},{label:"Fmin",file:"Fm"},{label:"F#min",file:"F#m"},{label:"Gmin",file:"Gm"},
  {label:"G#min",file:"G#m"},{label:"Amin",file:"Am"},{label:"A#min",file:"A#m"},{label:"Bmin",file:"Bm"}
];
const TYPES=["Bladee","Ecco2k","Playboi Carti","A$AP Rocky","Travis Scott","Future","Drain Gang"];
const BPMS=[140,150,160,165,170,175];
const LKEY="tagz_v2_log";

let st={style:"trap",feature:"piano",bpm:165,key:"Am",type:"Bladee",fmt:"file"};

function yymmdd(){
  const n=new Date();
  const yy=String(n.getFullYear()).slice(-2);
  const mm=String(n.getMonth()+1).padStart(2,"0");
  const dd=String(n.getDate()).padStart(2,"0");
  return `${yy}${mm}${dd}`;
}
function fname(){return `${st.bpm}_${st.key}_${st.style}-${st.feature}_${yymmdd()}_kedy`;}
function listing(){return `【出品】\nファイル名：${fname()}\nBPM：${st.bpm}\nキー：${st.key}\nSTYLE：${st.style}\nFEATURE：${st.feature}`;}
function yt(){return `[FREE] ${st.type} Type Beat "${st.style}-${st.feature}" | ${st.bpm} BPM (prod. kedy)`;}
function outText(){return st.fmt==="file"?fname():st.fmt==="listing"?listing():yt();}

function chip(label,cls,on,fn){const b=document.createElement("button");b.className="chip "+cls+(on?" on":"");b.textContent=label;b.onclick=fn;return b;}

function render(){
  const s=document.getElementById("styleChips");s.innerHTML="";
  STYLES.forEach(v=>s.appendChild(chip(v,"",st.style===v,()=>{st.style=v;render();})));
  const f=document.getElementById("featureChips");f.innerHTML="";
  FEATURES.forEach(v=>f.appendChild(chip(v,"feature",st.feature===v,()=>{st.feature=v;render();})));
  const b=document.getElementById("bpmChips");b.innerHTML="";
  BPMS.forEach(v=>b.appendChild(chip(v,"",st.bpm===v,()=>{st.bpm=v;render();})));
  document.getElementById("bpmVal").textContent=st.bpm;
  const k=document.getElementById("keyChips");k.innerHTML="";
  KEYS.forEach(v=>k.appendChild(chip(v.label,"key",st.key===v.file,()=>{st.key=v.file;render();})));
  const t=document.getElementById("typeChips");t.innerHTML="";
  TYPES.forEach(v=>t.appendChild(chip(v,"",st.type===v,()=>{st.type=v;render();})));
  document.querySelectorAll(".tab").forEach(el=>el.classList.toggle("on",el.dataset.f===st.fmt));
  document.getElementById("oText").textContent=outText();
  renderLog();
}

document.querySelectorAll(".tab").forEach(el=>el.onclick=()=>{st.fmt=el.dataset.f;render();});
document.getElementById("bpmUp").onclick=()=>{st.bpm++;render();};
document.getElementById("bpmDown").onclick=()=>{st.bpm--;render();};

const pick=a=>a[Math.floor(Math.random()*a.length)];
document.getElementById("spinBtn").onclick=()=>{
  let i=0;const iv=setInterval(()=>{
    const rs=pick(STYLES),rf=pick(FEATURES),rk=pick(KEYS).file;
    document.getElementById("oText").textContent=`${st.bpm}_${rk}_${rs}-${rf}_${yymmdd()}_kedy`;
    if(++i>=8){clearInterval(iv);
      st.style=pick(STYLES);
      st.feature=pick(FEATURES);
      st.key=pick(KEYS).file;
      st.fmt="file";render();
    }
  },45);
};

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1200);}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast("Copied")).catch(()=>fallbackCopy(txt));}
  else fallbackCopy(txt);
}
function fallbackCopy(txt){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);toast("Copied");}
document.getElementById("copyBtn").onclick=()=>copyText(outText());

function getLog(){try{return JSON.parse(localStorage.getItem(LKEY))||[];}catch(e){return [];}}
function setLog(a){try{localStorage.setItem(LKEY,JSON.stringify(a));}catch(e){}}
document.getElementById("saveBtn").onclick=()=>{
  const a=getLog();
  a.unshift({f:fname(),b:st.bpm,k:st.key,s:st.style,ft:st.feature,ts:Date.now()});
  setLog(a);toast("Saved");renderLog();
};
function renderLog(){
  const a=getLog();const list=document.getElementById("logList");list.innerHTML="";
  const now=new Date();const mo=a.filter(e=>{const d=new Date(e.ts);return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();}).length;
  document.getElementById("logCnt").textContent=`今月 ${mo}本 / 累計 ${a.length}本`;
  if(!a.length){list.innerHTML='<div class="empty">まだログなし。SPINして💾で貯まってく</div>';return;}
  a.forEach((e,i)=>{
    const d=document.createElement("div");d.className="logitem";
    const detail=e.s?`${e.s}-${e.ft||"—"}`:(e.m||"—");
    d.innerHTML=`<div class="li-main"><div class="li-name">${e.f}</div><div class="li-meta">${e.b}BPM · ${e.k} · ${detail}</div></div>`;
    const c=document.createElement("button");c.textContent="出品";c.onclick=()=>copyText(`【出品】\nファイル名：${e.f}\nBPM：${e.b}\nキー：${e.k}\nSTYLE / FEATURE：${detail}`);
    const x=document.createElement("button");x.className="del";x.textContent="✕";x.onclick=()=>{const b=getLog();b.splice(i,1);setLog(b);renderLog();};
    d.appendChild(c);d.appendChild(x);list.appendChild(d);
  });
}
render();
</script>
</body>
</html>
